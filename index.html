      border: 1px solid var(--border);

      padding: 12px;

      background: var(--light);

      padding: 10px;
      border: 0;

      color: var(--text);

      padding: 6px 10px;
      background: var(--light);

`// program to find the frequency of each element in the array
class elementfrequency {

// execution begins in main()

public static void main(String[] args) throws Exception {
int[] a = {1, 2, 2, 3, 1, 2};
boolean[] v = new boolean[a.length];
// visit each element of a one by one
for (int i = 0; i < a.length; i++) {
if (v[i]) continue;
int f = 1;
// go through a starting from index i + 1
for (int j = i + 1; j < a.length; j++) if (a[i] == a[j]) {
f++;
v[j] = true;
}
System.out.println(a[i]+" -> "+f);
}
}
}`,

// method to check whether a string is a valid password
static boolean validPassword(String p) {
if (p.length() < 8) return false;
int digits = 0;
// take each c from p.toCharArray( one by one
for (char c : p.toCharArray()) {
if (Character.isDigit(c)) digits++;
else if (!Character.isLetter(c)) return false;
}
return digits >= 2;
}

var wrapper = document.getElementById('topics-wrapper');

// Create one question and its answer.
function makeQuestion(q) {
  var item = document.createElement("div");
  item.className = "qa-item";

  var question = document.createElement("button");
  question.className = "question-btn";
  question.textContent = "Q" + q[0] + ". " + q[1];

  var answer = document.createElement("div");
  answer.className = "answer-panel";

  var code = q[2];

  var bar = document.createElement("div");
  bar.className = "codebar";
  bar.innerHTML = "<strong>Ans:</strong><span></span><button type='button'>Copy code</button>";
  bar.children[1].textContent = q[3];

  var copyButton = bar.lastChild;
  copyButton.onclick = function () {
    navigator.clipboard.writeText(code);
    copyButton.textContent = "Copied";
    setTimeout(function () {
      copyButton.textContent = "Copy code";
    }, 1400);
  };

  var codeBox = document.createElement("pre");
  codeBox.className = "src";

  var codeText = document.createElement("code");
  codeText.textContent = code;
  codeBox.appendChild(codeText);

  answer.appendChild(bar);
  answer.appendChild(codeBox);

  if (q[4]) {
    var outputTitle = document.createElement("div");
    outputTitle.className = "out-label";
    outputTitle.textContent = "OUTPUT";

    var output = document.createElement("pre");
    output.className = "term";
    output.textContent = q[4];

    answer.appendChild(outputTitle);
    answer.appendChild(output);
  }

  question.onclick = function () {
    item.classList.toggle("open");
  };

  item.appendChild(question);
  item.appendChild(answer);
  return item;
}

// Show all topics and their questions.
for (var i = 0; i < topics.length; i++) {
  var topic = topics[i];

  var section = document.createElement("div");
  section.className = "topic-section";

  var topicButton = document.createElement("button");
  topicButton.className = "topic-btn";
  topicButton.textContent = topic.name;

  var questions = document.createElement("div");
  questions.className = "questions-container";

  for (var j = 0; j < topic.questions.length; j++) {
    questions.appendChild(makeQuestion(topic.questions[j]));
  }

  topicButton.onclick = function () {
    var wasOpen = this.parentNode.classList.contains("open");
    var openTopics = document.querySelectorAll(".topic-section");

    for (var k = 0; k < openTopics.length; k++) {
      openTopics[k].classList.remove("open");
    }

    if (!wasOpen) {
      this.parentNode.classList.add("open");
      this.parentNode.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  };

  section.appendChild(topicButton);
  section.appendChild(questions);
  wrapper.appendChild(section);
}

// Set the page theme and let the button switch it.
var themeButton = document.getElementById("theme-btn");

if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
  document.documentElement.setAttribute("data-theme", "dark");
} else {
  document.documentElement.setAttribute("data-theme", "light");
}

themeButton.onclick = function () {
  var currentTheme = document.documentElement.getAttribute("data-theme");

  if (currentTheme === "dark") {
    document.documentElement.setAttribute("data-theme", "light");
  } else {
    document.documentElement.setAttribute("data-theme", "dark");
  }
};
